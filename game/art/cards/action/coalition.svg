<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
  <rect width="300" height="420" rx="18" fill="#efe2c0"/>
  <rect x="8" y="8" width="284" height="404" rx="13" fill="none" stroke="#8c2f2f" stroke-width="6"/>
  <rect x="8" y="8" width="284" height="56" rx="13" fill="#8c2f2f"/>
  <text x="150" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#efe2c0">Coalition</text>
  <text x="20" y="28" font-family="sans-serif" font-size="12" letter-spacing="2" fill="#efe2c0" opacity="0.85">ACTION</text>
  
  <g transform="translate(150 175)" fill="none" stroke="#8c2f2f" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M0 -34 C34 -34 34 6 0 6 C-34 6 -34 -34 0 -34" opacity="0.25"/>
    <path d="M0 -22 C20 -22 20 8 0 8 C-20 8 -20 -22 0 -22"/>
    <circle cx="0" cy="-7" r="4" fill="#8c2f2f"/>
  </g>
  <rect x="22" y="250" width="256" height="140" rx="10" fill="#ffffff" opacity="0.45"/>
  <text x="32" y="278" font-family="Georgia, serif" font-size="15" fill="#2b2218"><tspan x="32" y="278">From a shared territory, move any</tspan><tspan x="32" y="299">number of your clans into one</tspan><tspan x="32" y="320">adjacent territory, and name an</tspan><tspan x="32" y="341">opponent from that territory who</tspan><tspan x="32" y="362">may move their clans along. You</tspan><tspan x="32" y="383">instigate any resulting clash, in</tspan><tspan x="32" y="404">which neither of you may use</tspan><tspan x="32" y="425">Citadels or attack the other.</tspan></text>
</svg>
