<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- In-game board backdrop: a misty sea around the island, Catan-style soft vignette. -->
  <defs>
    <radialGradient id="sea" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#3a6b70"/>
      <stop offset="0.6" stop-color="#274d52"/>
      <stop offset="1" stop-color="#16292c"/>
    </radialGradient>
    <pattern id="waves" width="120" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <path d="M0 40 q30 -16 60 0 t60 0" fill="none" stroke="#4f9aa0" stroke-width="2" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#sea)"/>
  <rect width="1280" height="720" fill="url(#waves)"/>
  <ellipse cx="640" cy="360" rx="430" ry="300" fill="#2f4f4f" opacity="0.25"/>
</svg>
