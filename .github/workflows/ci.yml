name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine-and-server:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Inis.slnx

      - name: Build
        run: dotnet build Inis.slnx --no-restore -c Release

      - name: Test engine
        run: dotnet test Inis.Core.Tests --no-build -c Release --verbosity normal

      - name: Test server (auth, friends, WebSocket game session)
        run: dotnet test INISServer.Tests --no-build -c Release --verbosity normal

  docker:
    name: Server image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f INISServer/Dockerfile -t inisserver:ci .
