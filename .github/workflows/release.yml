name: Release

# Tag-driven release pipeline: pushing a version tag (e.g. v0.1.0) builds the desktop
# installers (Linux Flatpak, Windows MSI, macOS DMG), a signed sideload Android APK,
# and the server image, then attaches them to a GitHub Release. The per-push CI in
# ci.yml remains the build/test gate.
#
# Store submission (Google Play .aab, iOS .ipa) stays manual — it needs metadata,
# screenshots, and review. See docs/release-mobile.md.
#
# workflow_dispatch runs every build job as a dry run without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the server image to GHCR

env:
  GODOT_VERSION: 4.4.0
  DOTNET_VERSION: "10.0.x"

jobs:
  # ---------------------------------------------------------------- server image
  server-image:
    name: Server image → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        run: |
          # GHCR requires a lowercase repository path (the repo is "INISOnline").
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/inisserver
          TAG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          docker build -f INISServer/Dockerfile -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            docker push "$IMAGE:$TAG"
            docker push "$IMAGE:latest"
          else
            echo "Dry run (not a tag): skipping push."
          fi

  # ---------------------------------------------------------------- Linux (.flatpak)
  linux-flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Setup Godot (.NET) + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true
      - name: Build C# (export config)
        run: dotnet build game/INISOnline.sln -c ExportRelease
      - name: Export Linux binary
        run: |
          STAGING=packaging/linux/export-staging
          mkdir -p "$STAGING"
          godot --headless --path game --export-release "Linux" \
            "$GITHUB_WORKSPACE/$STAGING/INISOnline.x86_64"
      - name: Stage launcher, desktop entry, metadata, icon
        run: |
          STAGING=packaging/linux/export-staging
          cp packaging/linux/INISOnline.sh "$STAGING/"
          cp packaging/linux/com.aricummings.INISOnline.desktop "$STAGING/"
          cp packaging/linux/com.aricummings.INISOnline.metainfo.xml "$STAGING/"
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 256 -h 256 game/icon.svg -o "$STAGING/icon.png"
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: INISOnline.flatpak
          manifest-path: packaging/linux/com.aricummings.INISOnline.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: inis-linux-flatpak
          path: INISOnline.flatpak

  # ---------------------------------------------------------------- Windows (.msi)
  windows-msi:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true
      - name: Build C# (export config)
        run: dotnet build game/INISOnline.sln -c ExportRelease
      - name: Export Windows binary
        shell: bash
        run: |
          mkdir -p publish
          godot --headless --path game --export-release "Windows Desktop" \
            "$GITHUB_WORKSPACE/publish/INISOnline.exe"
      - name: Install WiX
        run: dotnet tool install --global wix
      - name: Build MSI
        run: wix build packaging/windows/INISOnline.wxs -d ExportDir=publish -o INISOnline.msi
      - uses: actions/upload-artifact@v4
        with:
          name: inis-windows-msi
          path: INISOnline.msi

  # ---------------------------------------------------------------- macOS (.dmg)
  # Signed + notarized DMG for direct distribution (NOT the Mac App Store).
  # Needs a "Developer ID Application" certificate; see docs/build.md.
  macos-dmg:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true
      - name: Install Apple signing certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
      - name: Build C# (export config)
        run: dotnet build game/INISOnline.sln -c ExportRelease
      - name: Export macOS (.dmg)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build/macos
          godot --headless --path game --export-release "macOS" \
            "$GITHUB_WORKSPACE/build/macos/INISOnline.dmg"
      - name: Notarize + staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit build/macos/INISOnline.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple build/macos/INISOnline.dmg
      - name: Clean up keychain
        if: ${{ always() }}
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
      - uses: actions/upload-artifact@v4
        with:
          name: inis-macos-dmg
          path: build/macos/*.dmg

  # ---------------------------------------------------------------- Android (.apk, sideload)
  # Signed sideload APK attached to the release. Google Play submission (.aab)
  # stays manual — see docs/release-mobile.md. Gate with the ENABLE_ANDROID_BUILDS
  # repository variable.
  android-apk:
    name: Android APK (sideload)
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_ANDROID_BUILDS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true
      - name: Install Android build template
        # gradle_build/use_gradle_build=true (required for C#) needs the Android
        # source template unpacked into the project — without it the preset is
        # reported as "configuration errors" and headless export fails.
        run: |
          TDIR=$(ls -d "$HOME"/.local/share/godot/export_templates/*mono* | head -1)
          mkdir -p game/android/build
          unzip -o -q "$TDIR/android_source.zip" -d game/android/build
          basename "$TDIR" > game/android/build/.build_version
          touch game/android/.gdignore
      - name: Configure Godot editor settings (SDK paths + debug keystore)
        run: |
          keytool -genkeypair -keystore "$HOME/.android-debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA
          mkdir -p ~/.config/godot
          # Godot 4.4 reads the version-suffixed settings file.
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOFSET
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOFSET
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/release.keystore"
      - name: Build C# (export config)
        run: dotnet build game/INISOnline.sln -c ExportRelease
      - name: Import project resources
        run: godot --headless --path game --import || true
      - name: Export signed .apk
        env:
          # Godot reads release-signing credentials from these env vars,
          # keeping secrets out of export_presets.cfg.
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build/android
          godot --headless --path game --export-release "Android" \
            "$GITHUB_WORKSPACE/build/android/INISOnline.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: inis-android-apk
          path: build/android/*.apk

  # ---------------------------------------------------------------- GitHub Release
  release:
    name: Publish GitHub Release
    needs: [server-image, linux-flatpak, windows-msi, macos-dmg, android-apk]
    runs-on: ubuntu-latest
    # Publish only for tag pushes, and only when every required job succeeded
    # (android-apk may be skipped via the ENABLE_ANDROID_BUILDS variable).
    if: >-
      ${{ !cancelled()
          && startsWith(github.ref, 'refs/tags/')
          && needs.server-image.result == 'success'
          && needs.linux-flatpak.result == 'success'
          && needs.windows-msi.result == 'success'
          && needs.macos-dmg.result == 'success'
          && contains(fromJSON('["success","skipped"]'), needs.android-apk.result) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: dist/**/*
