name: Release

# Tag-driven release pipeline: pushing a version tag (e.g. v0.1.0) builds the desktop
# installers (Linux Flatpak, Windows MSI, macOS DMG) and the server image, then attaches
# them to a GitHub Release. The per-push CI in ci.yml remains the build/test gate.
#
# Mobile (iOS / Android) is NOT built here — store submission needs manual metadata,
# screenshots, and review. See docs/release-mobile.md for the iOS + Android process.
on:
  push:
    tags: ["v*"]
  # Manual dispatch for pipeline validation. Requires a `version` input that stands
  # in for the tag name (used as the docker image tag, GitHub Release name, etc.).
  # Real releases still go through the tag-push path above.
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v0.1.0-rc1). Used as image tag + release name."
        required: true
        default: "v0.0.0-dev"
      draft_release:
        description: "Publish the GitHub Release as a draft (recommended for validation runs)."
        type: boolean
        default: true

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the server image to GHCR

env:
  GODOT_VERSION: 4.4.0
  DOTNET_VERSION: "10.0.x"
  # RELEASE_VERSION resolves to the tag on a real push, or the workflow_dispatch
  # input on a manual run. Jobs use this instead of GITHUB_REF_NAME directly.
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  # ---------------------------------------------------------------- server image
  server-image:
    name: Server image → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        run: |
          # GHCR requires the image path (owner/repo/image) to be all lowercase.
          # github.repository is "0xnullsect0r/INISOnline" (mixed case) — lowercase it.
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/inisserver
          TAG=${RELEASE_VERSION}
          docker build -f INISServer/Dockerfile -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  # ---------------------------------------------------------------- Linux (.flatpak)
  linux-flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Setup Godot (.NET) + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true
      - name: Build C# (export config)
        run: dotnet build game/INISOnline.sln -c ExportRelease
      - name: Export Linux binary
        run: |
          STAGING=packaging/linux/export-staging
          mkdir -p "$STAGING"
          godot --headless --path game --export-release "Linux" \
            "$GITHUB_WORKSPACE/$STAGING/INISOnline.x86_64"
      - name: Stage launcher, desktop entry, metadata, icon
        run: |
          STAGING=packaging/linux/export-staging
          cp packaging/linux/INISOnline.sh "$STAGING/"
          cp packaging/linux/com.aricummings.INISOnline.desktop "$STAGING/"
          cp packaging/linux/com.aricummings.INISOnline.metainfo.xml "$STAGING/"
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 256 -h 256 game/icon.svg -o "$STAGING/icon.png"
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: INISOnline.flatpak
          manifest-path: packaging/linux/com.aricummings.INISOnline.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: inis-linux-flatpak
          path: INISOnline.flatpak

  # ---------------------------------------------------------------- Windows (.msi)
  windows-msi:
    name: Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true
      - name: Build C# (export config)
        run: dotnet build game/INISOnline.sln -c ExportRelease
      - name: Export Windows binary
        shell: bash
        run: |
          mkdir -p publish
          godot --headless --path game --export-release "Windows Desktop" \
            "$GITHUB_WORKSPACE/publish/INISOnline.exe"
      - name: Install WiX
        # Pin to v5 — v7 requires accepting the OSMF EULA (WIX7015). v5 supports the
        # `<Files Include>` harvester used by INISOnline.wxs.
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build MSI
        run: wix build packaging/windows/INISOnline.wxs -d ExportDir=publish -o INISOnline.msi
      - uses: actions/upload-artifact@v4
        with:
          name: inis-windows-msi
          path: INISOnline.msi

  # ---------------------------------------------------------------- macOS (.dmg)
  # Signed + notarized DMG for direct distribution (NOT the Mac App Store).
  # Needs a "Developer ID Application" certificate; see docs/build.md.
  macos-dmg:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true
      - name: Install Apple signing certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          echo "$APPLE_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          # Put the temp keychain first in the search list so codesign finds our cert.
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          # Discover the Developer ID identity from the just-installed cert and inject it
          # into the Godot macOS export preset (empty string in the repo — filled per-build).
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in APPLE_CERT_P12."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          # Inject the Developer ID identity into the macOS export preset (empty in the
          # repo — filled per-build from the just-installed cert).
          /usr/bin/sed -i.bak "s|codesign/identity=\"\"|codesign/identity=\"$IDENTITY\"|" \
            game/export_presets.cfg
          rm -f game/export_presets.cfg.bak
      - name: Build C# (export config)
        run: dotnet build game/INISOnline.sln -c ExportRelease
      - name: Export macOS (.dmg)
        run: |
          mkdir -p build/macos
          godot --headless --path game --export-release "macOS" \
            "$GITHUB_WORKSPACE/build/macos/INISOnline.dmg"
      - name: Notarize + staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit build/macos/INISOnline.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple build/macos/INISOnline.dmg
      - name: Clean up keychain
        if: ${{ always() }}
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
      - uses: actions/upload-artifact@v4
        with:
          name: inis-macos-dmg
          path: build/macos/*.dmg

  # ---------------------------------------------------------------- GitHub Release
  release:
    name: Publish GitHub Release
    needs: [server-image, linux-flatpak, windows-msi, macos-dmg]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*
          # On manual dispatch: use the input version as the tag/name and (by default)
          # publish as a draft so we don't create a real release for a pipeline test.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_release || false }}
