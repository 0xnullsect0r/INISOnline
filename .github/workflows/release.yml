name: Release

# Tag-driven release pipeline: pushing a version tag (e.g. v0.1.0) builds the client for every
# platform and the server image, then attaches the artifacts to a GitHub Release. The per-push
# CI in ci.yml remains the build/test gate; this only runs on tags.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push the server image to GHCR

env:
  GODOT_VERSION: 4.4.0
  DOTNET_VERSION: "10.0.x"

jobs:
  # ---------------------------------------------------------------- server image
  server-image:
    name: Server image → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/inisserver
          TAG=${GITHUB_REF_NAME}
          docker build -f INISServer/Dockerfile -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  # ---------------------------------------------------------------- desktop exports
  desktop:
    name: Export ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Linux"
            out: INISOnline.x86_64
            artifact: inis-linux
          - preset: "Windows Desktop"
            out: INISOnline.exe
            artifact: inis-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Setup Godot (.NET) + export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true
      - name: Build C# (export config)
        run: dotnet build game/INISOnline.sln -c ExportRelease
      - name: Export
        run: |
          mkdir -p build/${{ matrix.artifact }}
          godot --headless --path game --export-release "${{ matrix.preset }}" \
            "../build/${{ matrix.artifact }}/${{ matrix.out }}"
      - name: Package
        run: cd build && zip -r "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}.zip

  # ---------------------------------------------------------------- macOS + iOS
  # Needs a macOS runner and Apple signing material; runs only when those secrets exist.
  apple:
    name: Export macOS & iOS
    runs-on: macos-latest
    if: ${{ vars.ENABLE_APPLE_BUILDS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true
      - name: Install Apple certificate and provisioning profile
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          echo "$APPLE_CERT_P12" | base64 --decode > "$CERT_PATH"
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build C# (export config)
        run: dotnet build game/INISOnline.sln -c ExportRelease
      - name: Export macOS (.dmg)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build/macos
          godot --headless --path game --export-release "macOS" ../build/macos/INISOnline.dmg
      - name: Export iOS (.ipa)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build/ios
          godot --headless --path game --export-release "iOS" ../build/ios/INISOnline.ipa
      - name: Notarize macOS build
        if: ${{ vars.ENABLE_NOTARIZATION == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit build/macos/INISOnline.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple build/macos/INISOnline.dmg
      - name: Clean up keychain
        if: ${{ always() }}
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
      - uses: actions/upload-artifact@v4
        with:
          name: inis-macos
          path: build/macos/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: inis-ios
          path: build/ios/*.ipa

  # ---------------------------------------------------------------- Android
  android:
    name: Export Android
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_ANDROID_BUILDS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ~/.android/release.keystore
      - name: Configure Godot Android export settings
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          EDITOR_SETTINGS_DIR=~/.config/godot
          mkdir -p "$EDITOR_SETTINGS_DIR"
          cat > "$EDITOR_SETTINGS_DIR/editor_settings-4.tres" <<EOFSET
          [gd_resource type="EditorSettings"]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOFSET

          sed -i 's|keystore/release=""|keystore/release="'"$HOME/.android/release.keystore"'"|' \
            game/export_presets.cfg
          sed -i '/keystore\/release=/a keystore/release_user="'"$ANDROID_KEY_ALIAS"'"' \
            game/export_presets.cfg
          sed -i '/keystore\/release_user=/a keystore/release_password="'"$ANDROID_KEYSTORE_PASSWORD"'"' \
            game/export_presets.cfg
      - name: Build C# (export config)
        run: dotnet build game/INISOnline.sln -c ExportRelease
      - name: Export .apk
        run: |
          mkdir -p build/android
          godot --headless --path game --export-release "Android" ../build/android/INISOnline.apk
      - uses: actions/upload-artifact@v4
        with:
          name: inis-android
          path: build/android/*

  # ---------------------------------------------------------------- GitHub Release
  release:
    name: Publish GitHub Release
    needs: [server-image, desktop, apple, android]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.desktop.result != 'failure' && needs.server-image.result != 'failure' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*
