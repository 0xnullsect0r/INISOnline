# INISServer — single-compose deployment.
# The API is published on host port 80 for the upstream reverse proxy that fronts
# inis.aricummings.com (it terminates TLS and forwards to this service).
#
# Required environment (e.g. in a .env file next to this compose file):
#   POSTGRES_PASSWORD  database password
#   JWT_SIGNING_KEY    strong signing key, e.g. `openssl rand -base64 48`
# The server refuses to start outside Development on the well-known dev key.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inis
      POSTGRES_USER: inis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see header comment)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inis"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: INISServer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=inis;Username=inis;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY (see header comment)}
    ports:
      - "80:80"

volumes:
  pgdata:
